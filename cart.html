<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusBite | Cart</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="main-header">

    <div class="header-inner">

        <a href="menu.html" class="brand">

            <div class="brand-icon small">
                🍴
            </div>

            <div>
                <h2>CampusBite</h2>
                <span>School Canteen</span>
            </div>

        </a>

        <nav>

            <a href="menu.html">
                Menu
            </a>

            <a href="cart.html" class="active">
                Cart
                <span
                    class="cart-count"
                    id="cartCount"
                >
                    0
                </span>
            </a>

            <a
                href="index.html"
                onclick="logout()"
            >
                Logout
            </a>

        </nav>

    </div>

</header>


<main class="page-container">

    <div class="page-title">

        <span class="small-label">
            YOUR ORDER
        </span>

        <h1>
            Shopping Cart
        </h1>

        <p>
            Review your order before checkout.
        </p>

    </div>


    <div class="cart-layout">

        <section class="cart-card">

            <div
                id="cartItems"
                class="cart-items"
            ></div>

        </section>


        <aside class="summary-card">

            <span class="small-label">
                ORDER SUMMARY
            </span>

            <h2>
                Total
            </h2>

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    ₱0
                </strong>

            </div>

            <div class="summary-row">

                <span>
                    Service Fee
                </span>

                <strong>
                    ₱0
                </strong>

            </div>

            <div class="summary-divider"></div>

            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="total">
                    ₱0
                </strong>

            </div>

            <button
                onclick="checkout()"
                class="btn btn-primary full-width"
            >
                Place Order
            </button>

            <a
                href="menu.html"
                class="continue-shopping"
            >
                ← Continue Shopping
            </a>

        </aside>

    </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
